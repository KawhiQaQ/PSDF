[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psdf-model"
version = "0.1.0"
description = "PSDF model architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
pretrained = ["timm>=1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["psdf*"]
